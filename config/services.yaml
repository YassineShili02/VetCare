parameters:
  dossier_medical_images_dir: '%kernel.project_dir%/public/uploads/dossier_medical'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  # Tous les services SAUF EmailJsService
  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'
      - '../src/Service/EmailJsService.php'

  # ✅ Configuration EXPLICITE de EmailJsService (après App\:)
  App\Service\EmailJsService:
    autowire: false
    arguments:
      - '@Symfony\Contracts\HttpClient\HttpClientInterface'
      - '%env(EMAILJS_SERVICE_ID)%'
      - '%env(EMAILJS_TEMPLATE_ID)%'
      - '%env(EMAILJS_USER_ID)%'

  App\Controller\:
    resource: '../src/Controller/'
    tags: ['controller.service_arguments']
    bind:
      $dossierMedicalImagesDir: '%dossier_medical_images_dir%'