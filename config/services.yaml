# config/services.yaml

# Les paramètres doivent être dans un fichier séparé ou ici
parameters:
  dossier_medical_images_dir: '%kernel.project_dir%/public/uploads/dossier_medical'

services:
  # Les services par défaut
  _defaults:

    autowire: true      # Active l'autowiring pour tous les services
    autoconfigure: true # Active l'autoconfiguration
    public: false       # Les services sont privés par défaut

  # Tous les services dans le namespace App\ sont chargés automatiquement

  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'
      - '../src/Service/EmailJsService.php'

  # ✅ Configuration EXPLICITE de EmailJsService (après App\:)
  App\Service\EmailJsService:
    autowire: false
    arguments:
      - '@Symfony\Contracts\HttpClient\HttpClientInterface'
      - '%env(EMAILJS_SERVICE_ID)%'
      - '%env(EMAILJS_TEMPLATE_ID)%'
      - '%env(EMAILJS_USER_ID)%'

  # Configuration spécifique pour les contrôleurs
  App\Controller\:
    resource: '../src/Controller/'
    tags: ['controller.service_arguments']
    bind:
      $dossierMedicalImagesDir: '%dossier_medical_images_dir%'