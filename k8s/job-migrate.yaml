apiVersion: batch/v1
kind: Job
metadata:
  name: vetcare-migrate
spec:
  template:
    spec:
      containers:
      - name: migrate
        image: yassineshili/vetcare:latest
        command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--env=prod"]
        envFrom:
        - configMapRef:
            name: vetcare-config
        - secretRef:
            name: vetcare-secrets
      restartPolicy: Never
  backoffLimit: 1